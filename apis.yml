aid: str8bat
name: str8bat
description: >-
  str8bat is a Bangalore, India based sports-technology company that builds a pocket-sized
  IoT sensor which attaches to a cricket bat and captures batting metrics in real time —
  bat speed, impact speed, back-lift angle, timing, sweet-spot placement and a 360-degree
  view of every shot. The sensor pairs with the str8bat mobile app (iOS and Android) to
  deliver instant, visual and actionable insights plus an AI cricket coach. The company
  reports 30,000+ active users, 6+ million shots recorded and operations across 350+
  Indian cities and 14+ countries. str8bat is a consumer hardware and mobile-app company
  and publishes no first-party developer API; its str8bat.com storefront runs on Shopify,
  which exposes standard commerce discovery surfaces (customer-account OIDC and a Universal
  Commerce Protocol agent-commerce MCP endpoint).
